name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install, lint, build, test
        env:
          # mongodb-memory-server downloads MongoDB (~100 MB) here on install, for the tests; the cache above keeps it
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
        run: |
          npm ci
          npm run lint --workspaces --if-present
          npm run build --workspaces --if-present
          npm test --workspaces --if-present

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Records each deploy under the repo's Deployments, linking to the live app.
    environment:
      name: production
      url: https://compnetchatapp.onrender.com
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # forks don't have this secret, so skip there instead of failing
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set, skipping deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
